services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: "3001"
      APP_CONFIG_FILE: /app/app-config.json
      GOOGLE_SERVICE_ACCOUNT_FILE: /app/google-service-account.json
    volumes:
      - ./app-config.json:/app/app-config.json:ro
      - ./google-service-account.json:/app/google-service-account.json:ro
    ports:
      - "3001:3001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_URL: ${VITE_BASE_URL}
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
